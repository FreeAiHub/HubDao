<!doctype html>
<html lang="pt" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0e1116;
        --ink: #f4f1ea;
        --accent: #7bd88f;
        --muted: #8b93a1;
        --font-display: "Outfit";
        --font-body: "Inter";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-body);
        color: var(--ink);
      }
      .layer {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 120px;
      }
      .kicker {
        font-size: 40px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 40px;
      }
      .headline {
        font-family: var(--font-display);
        font-size: 128px;
        font-weight: 700;
        line-height: 1.02;
        letter-spacing: -0.03em;
      }
      .sub {
        margin-top: 48px;
        font-size: 46px;
        line-height: 1.35;
        color: var(--muted);
      }
      .browser {
        width: 780px;
        height: 1020px;
        border-radius: 36px;
        background: #1a1f27;
        border: 2px solid #2a313c;
        overflow: hidden;
        text-align: left;
      }
      .bar {
        height: 72px;
        background: #232a35;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 28px;
      }
      .dot {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #3a4250;
      }
      .block {
        margin: 40px 40px 0;
        border-radius: 20px;
        background: #2a313c;
      }
      .block.hero {
        height: 360px;
        background: linear-gradient(135deg, #2f6b45, #7bd88f);
      }
      .block.line {
        height: 44px;
        width: 70%;
      }
      .block.line.short {
        width: 45%;
      }
      .block.cta {
        height: 110px;
        width: 60%;
        background: var(--accent);
      }
      .price {
        font-family: var(--font-display);
        font-size: 150px;
        font-weight: 700;
        color: var(--accent);
      }
      .brand {
        margin-top: 60px;
        font-size: 38px;
        color: var(--muted);
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
    >
      <!-- Scene 1: hook -->
      <div id="s1" class="clip layer" data-start="0" data-duration="3.2" data-track-index="0" data-track-kind="graphics">
        <div id="s1-inner">
          <p id="s1-kicker" class="kicker">FarmSite</p>
          <h1 id="s1-title" class="headline">O seu negócio ainda não tem site?</h1>
        </div>
      </div>

      <!-- Scene 2: the site appears -->
      <div id="s2" class="clip layer" data-start="3.2" data-duration="3.6" data-track-index="0" data-track-kind="graphics">
        <div id="s2-inner">
          <div id="browser" class="browser">
            <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            <div id="b-hero" class="block hero"></div>
            <div id="b-l1" class="block line"></div>
            <div id="b-l2" class="block line short"></div>
            <div id="b-cta" class="block cta"></div>
          </div>
          <p id="s2-sub" class="sub">Pronto no mesmo dia.</p>
        </div>
      </div>

      <!-- Scene 3: offer + brand -->
      <div id="s3" class="clip layer" data-start="6.8" data-duration="3.2" data-track-index="0" data-track-kind="graphics">
        <div id="s3-inner">
          <p id="s3-kicker" class="kicker">Só paga se gostar</p>
          <p id="s3-price" class="price">desde €200</p>
          <p id="s3-brand" class="brand">Made by CrowHub Studio</p>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Scene 1
      tl.fromTo("#s1-kicker", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.2);
      tl.fromTo("#s1-title", { scale: 1.06 }, { scale: 1, duration: 1.2, ease: "power3.out" }, 0);
      tl.to("#s1-inner", { opacity: 0, y: -40, duration: 0.4, ease: "power2.in" }, 2.75);

      // Scene 2
      tl.fromTo("#browser", { opacity: 0, scale: 0.9, y: 80 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "power3.out" }, 3.3);
      tl.fromTo(["#b-hero", "#b-l1", "#b-l2", "#b-cta"], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.18, ease: "power2.out" }, 3.8);
      tl.fromTo("#s2-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.9);
      tl.to("#s2-inner", { opacity: 0, scale: 0.96, duration: 0.4, ease: "power2.in" }, 6.35);

      // Scene 3
      tl.fromTo("#s3-kicker", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 6.9);
      tl.fromTo("#s3-price", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.6)" }, 7.15);
      tl.fromTo("#s3-brand", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 7.8);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
